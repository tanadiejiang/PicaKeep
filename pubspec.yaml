name: picakeep
description: "PicaKeep - 本地漫画阅读器 / 收藏管理器"
publish_to: 'none'
# `+N` 是 Android 的 versionCode。**N 必须单调不减**：Android 拒绝安装 versionCode
# 低于设备上已有版本的包（INSTALL_FAILED_VERSION_DOWNGRADE），而 `flutter run` /
# IDE 的 Run 在覆盖安装失败且应用已安装时会**无条件卸载重装**，应用私有目录
# （含默认下载目录里的 download.db 与已下载漫画）一并被清空且不可恢复。
# 实测已发生三次。
#
# **每次发版把 N 加一**，不要让它回退。
#
# ⚠️ 两个已经踩过的坑：
#
# 1. **分 ABI 会给 versionCode 加偏移**：`--split-per-abi` 打出的 arm64-v8a 包
#    versionCode = N + 2000。于是同一次提交用不同方式构建会得到不同版本号，
#    交替安装必然降级。项目统一走**非 split 单 ABI**
#    （`flutter build apk --target-platform android-arm64`，47.0 MB），
#    它与 IDE 的 `flutter run`（47.6 MB）versionCode 一致。
#
# 2. **`--target-platform` 必须配 clean**：增量构建会复用上一次三 ABI 的中间
#    产物，体积仍是 111 MB，看起来像"该参数无效"。
#
# 本轮曾因误用 split 装出 4002，为覆盖它把基准临时抬到 4003；现已卸载重装，
# 基准回到 1 重新开始。
version: 1.9.88+5

environment:
  sdk: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.0.16
  dynamic_color: ^1.6.9
  crypto: any
  photo_view:
    git:
      url: https://github.com/wgh136/photo_view
      ref: a1255d1
  url_launcher: ^6.1.8
  path_provider: ^2.0.12
  path: ^1.9.1
  shimmer_animation: ^2.1.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_displaymode: 0.6.0
  flutter_reorderable_grid_view: 5.0.1
  # 瀑布流（图集页「插画」视图用）。选它的理由（24 号计划步骤 1 决策 1）：
  # 只有它提供**真正的 sliver** 瀑布流（`SliverMasonryGrid.count`），因此仍支持
  # 懒加载 + 与既有 CustomScrollView 拼接。被否决的方案：
  # B) 已声明未用的 `sliver_tools` —— 只提供 sliver 组合能力，**不含变高布局算法**，
  #    用它仍要自己写分配算法，等于白加一个未经本项目检验的依赖；
  # C) 纯手写多列 Column —— **无法懒加载**，整列表 widget 与图片一次性构建；
  #    Pixiv 下载条目可达数百条、每项一张大图，配合 BaseImageProvider 的
  #    50 MB FIFO 字节缓存（foundation/image_loader/base_image_provider.dart:99）
  #    内存风险不可接受。
  flutter_staggered_grid_view: ^0.7.0
  sqlite3: 2.1.0
  sqlite3_flutter_libs: ^0.5.24
  sliver_tools: ^0.2.12
  collection: ^1.18.0
  file_picker: ^8.0.0
  window_manager: ^0.4.2
  tray_manager: ^0.2.3
  share_plus: ^7.2.2
  file_selector: ^1.0.3
  flutter_image_gallery_saver: ^1.1.3
  local_auth: ^2.3.0
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0
  archive: ^4.0.9
  charset: ^2.0.1
  pointycastle: ^3.9.1
  image: ^4.0.0
  dio: 5.4.1
  cookie_jar: any
  dio_cookie_manager: any
  uuid: any
  html: ^0.15.4
  flutter_inappwebview:
    git:
      url: https://github.com/venera-app/flutter_inappwebview
      path: flutter_inappwebview
      ref: 3ef899b
  desktop_webview_window:
    git:
      url: https://github.com/wgh136/flutter_desktop_webview
      path: packages/desktop_webview_window
      ref: 7801fc5
  flutter_markdown: ^0.7.7
  package_info_plus: ^8.3.1

dependency_overrides:
  local_auth_windows:
    path: packages/local_auth_windows_stub

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 纯 Dart 探索契约层（无 Flutter 依赖）用 dart test 直接跑。
  test: ^1.24.0
  flutter_lints: ^2.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/tags.json
    - assets/translation.json
    - assets/tags_tw.json
    - assets/tray_icon.ico
    - assets/web_console/
    - assets/web_console/css/
    - assets/web_console/js/
